# Публикация instrument через уже работающий nginx. Выбери ОДИН вариант.
# Приложение слушает только 127.0.0.1:8030 (см. deploy/setup-vm.sh), наружу порт не открывается.
# После правок:  sudo nginx -t && sudo systemctl reload nginx

# ---------------------------------------------------------------------------
# Вариант A: путь на существующем сайте с HTTPS, например https://example.ru/instrument/
# Вставь эти два location ВНУТРЬ существующего блока `server { listen 443 ssl; ... }`
# в /etc/nginx/sites-enabled/<твой-сайт>. Фронтенд использует относительные URL,
# поэтому работает под любым префиксом — главное, завершающий «/» в proxy_pass.
# ---------------------------------------------------------------------------
#
#   location = /instrument { return 301 /instrument/; }
#
#   location /instrument/ {
#       proxy_pass http://127.0.0.1:8030/;
#       proxy_set_header Host $host;
#       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#       proxy_set_header X-Forwarded-Proto $scheme;
#       client_max_body_size 60m;      # загрузка xlsx (лимит приложения — 50 МБ)
#       proxy_read_timeout 120s;
#   }

# ---------------------------------------------------------------------------
# Вариант B: отдельный поддомен, например instrument.example.ru
# 1) A-запись поддомена -> публичный IP ВМ;
# 2) положи этот файл в /etc/nginx/sites-available/instrument, раскомментируй блок,
#    подставь домен и сделай симлинк в sites-enabled;
# 3) сертификат: sudo certbot --nginx -d instrument.example.ru
#    (certbot сам допишет listen 443 ssl и редирект с 80).
# ---------------------------------------------------------------------------
#
# server {
#     listen 80;
#     listen [::]:80;
#     server_name instrument.example.ru;
#
#     client_max_body_size 60m;
#
#     location / {
#         proxy_pass http://127.0.0.1:8030;
#         proxy_set_header Host $host;
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#         proxy_read_timeout 120s;
#     }
# }
